[project]
name = "koshguard"
version = "0.1.0"
description = "Secure conversational banking assistant: guardrails, LLM gateway, RAG and observability around an LLM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JaiKartikey" }]

[tool.setuptools.packages.find]
include = ["koshguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
