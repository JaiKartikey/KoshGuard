    prompt: What is the FD rate for senior citizens?
  - id: ben-02
    prompt: How do I block my lost debit card?
  - id: ben-03
    prompt: What is the minimum balance for a Kosh Classic account?
  - id: ben-04
    prompt: What is the daily UPI limit?
  - id: ben-05
    prompt: Which documents are accepted for KYC?
  - id: ben-06
